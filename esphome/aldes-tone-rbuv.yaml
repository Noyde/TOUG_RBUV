  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "PSE Débit Nominal"
    icon: "mdi:gauge"
    register_type: holding
    address: 0xF7
    value_type: U_WORD
    unit_of_measurement: "Pa"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Débit Mini 1 Bouche"
    icon: "mdi:weather-windy"
    register_type: holding
    address: 0xF9
    value_type: U_WORD
    unit_of_measurement: "m³/h"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "PSE Débit Mini"
    icon: "mdi:gauge"
    register_type: holding
    address: 0xF8
    value_type: U_WORD
    unit_of_measurement: "Pa"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Pression Statique"
    icon: "mdi:gauge"
    register_type: holding
    address: 0xFB
    value_type: U_WORD
    unit_of_measurement: "Pa"

# ═══════════════════════════════════════════════════════════════
# SENSORS - Diagnostic WiFi / Uptime
# ═══════════════════════════════════════════════════════════════

  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

# ═══════════════════════════════════════════════════════════════
# TEXT SENSORS
# ═══════════════════════════════════════════════════════════════

text_sensor:
  - platform: version
    name: "Version ESPHome"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic
    ssid:
      name: "SSID WiFi"
      entity_category: diagnostic

