  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "EEV2"
    entity_category: diagnostic
    icon: "mdi:valve"
    register_type: holding
    address: 0x69
    value_type: U_WORD
    unit_of_measurement: "Pls"

