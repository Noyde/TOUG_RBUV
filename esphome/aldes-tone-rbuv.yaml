# ═══════════════════════════════════════════════════════════════
# TOUG_RBUV - Configuration ESPHome pour PAC Aldes T.One RBUV
# Modèles 2018 et antérieurs
# ═══════════════════════════════════════════════════════════════
#
# Ce fichier utilise le composant custom aldes_tone pour l'écriture
# via le protocole propriétaire 0x17.
#
# Prérequis:
# - Télécommande Aldes DÉBRANCHÉE (collision sinon)
# - Connexion sur bus RS485 télécommande (19200 bauds)
#
# ═══════════════════════════════════════════════════════════════

esphome:
  name: aldes-tone
  friendly_name: "Aldes T.One AIR RBUV"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Aldes-Tone Fallback"
    password: "fallback123"

captive_portal:

# ═══════════════════════════════════════════════════════════════
# COMPOSANT EXTERNE - Aldes T.One Writer (protocole 0x17)
# ═══════════════════════════════════════════════════════════════

external_components:
  - source:
      type: local
      path: components

# ═══════════════════════════════════════════════════════════════
# UART - Bus RS485 télécommande
# ═══════════════════════════════════════════════════════════════

uart:
  id: mod_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  parity: EVEN
  stop_bits: 1

# ═══════════════════════════════════════════════════════════════
# MODBUS - Lecture standard des registres
# ═══════════════════════════════════════════════════════════════

modbus:
  id: modbus1
  uart_id: mod_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: aldes
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 30s

# ═══════════════════════════════════════════════════════════════
# ALDES TONE WRITER - Écriture protocole 0x17
# ═══════════════════════════════════════════════════════════════

aldes_tone:
  id: aldes_writer
  uart_id: mod_uart

# ═══════════════════════════════════════════════════════════════
# SELECT - Mode PAC
# ═══════════════════════════════════════════════════════════════

select:
  - platform: template
    name: "Mode PAC"
    id: mode_pac
    icon: "mdi:hvac"
    options:
      - "Off"
      - "Chauffage Confort"
      - "Chauffage Eco"
      - "Clim Confort"
      - "Clim Boost"
      - "Vacances"
    initial_option: "Chauffage Confort"
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Off") {
            id(aldes_writer)->set_off();
          } else if (x == "Chauffage Confort") {
            id(aldes_writer)->set_chauffage_confort();
          } else if (x == "Chauffage Eco") {
            id(aldes_writer)->set_chauffage_eco();
          } else if (x == "Clim Confort") {
            id(aldes_writer)->set_clim_confort();
          } else if (x == "Clim Boost") {
            id(aldes_writer)->set_clim_boost();
          } else if (x == "Vacances") {
            id(aldes_writer)->set_vacances();
          }

# ═══════════════════════════════════════════════════════════════
# SENSORS - Lecture Modbus (températures, états)
# ═══════════════════════════════════════════════════════════════

sensor:
  # --- SYSTÈME ---
  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Mode PAC (lecture)"
    id: mode_pac_lecture
    register_type: holding
    address: 0x09
    value_type: U_WORD
    icon: "mdi:hvac"

  # --- THERMOSTATS - TEMPÉRATURES ---
  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Zone 1"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x24
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Zone 2"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x25
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Zone 3"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x26
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
