# ═══════════════════════════════════════════════════════════════
# TOUG_RBUV - Configuration ESPHome pour PAC Aldes T.One RBUV
# Modèles 2018 et antérieurs
# ═══════════════════════════════════════════════════════════════
#
# Ce fichier utilise le composant custom aldes_tone pour l'écriture
# via le protocole propriétaire 0x17.
#
# Prérequis:
# - Télécommande Aldes DÉBRANCHÉE (collision sinon)
# - Connexion sur bus RS485 télécommande (19200 bauds)
#
# Configuration:
# - Copier secrets_example.yaml vers secrets.yaml
# - Personnaliser les noms de zones dans substitutions ci-dessous
#   ou dans secrets.yaml
#
# ═══════════════════════════════════════════════════════════════

# Noms des zones (personnalisables via secrets.yaml)
substitutions:
  zone1_name: "Zone 1"
  zone1bis_name: "Zone 1 bis"
  zone2_name: "Zone 2"
  zone3_name: "Zone 3"
  zone4_name: "Zone 4"
  zone5_name: "Zone 5"
  # Noms des bouches (personnalisables)
  bouche1a_name: "Bouche Zone 1a"
  bouche1b_name: "Bouche Zone 1b"
  bouche2_name: "Bouche Zone 2"
  bouche3_name: "Bouche Zone 3"
  bouche4_name: "Bouche Zone 4"
  bouche5_name: "Bouche Zone 5"

esphome:
  name: aldes-tone
  friendly_name: "Aldes T.One AIR"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Aldes-Tone Fallback"
    password: "fallback123"

captive_portal:

# ═══════════════════════════════════════════════════════════════
# EXTERNAL COMPONENT - Aldes T.One Writer
# ═══════════════════════════════════════════════════════════════

external_components:
  - source:
      type: local
      path: aldes_tone_component/components

# ═══════════════════════════════════════════════════════════════
# UART pour Modbus RS485
# ═══════════════════════════════════════════════════════════════

uart:
  id: mod_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  parity: EVEN
  stop_bits: 1

# ═══════════════════════════════════════════════════════════════
# Modbus Controller (pour lecture standard)
# ═══════════════════════════════════════════════════════════════

modbus:
  id: modbus1
  uart_id: mod_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: aldes
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 30s

# ═══════════════════════════════════════════════════════════════
# ALDES TONE WRITER (Protocole 0x17 pour écriture modes)
# ═══════════════════════════════════════════════════════════════

aldes_tone:
  id: aldes_writer
  uart_id: mod_uart

# ═══════════════════════════════════════════════════════════════
# SELECT - Mode PAC (écriture via protocole custom 0x17)
# ═══════════════════════════════════════════════════════════════

select:
  - platform: template
    name: "Mode PAC"
    id: mode_pac
    icon: "mdi:hvac"
    options:
      - "Off"
      - "Chauffage Confort"
      - "Chauffage Eco"
      - "Clim Confort"
      - "Clim Boost"
      - "Vacances"
    initial_option: "Chauffage Confort"
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Off") {
            id(aldes_writer)->set_off();
          } else if (x == "Chauffage Confort") {
            id(aldes_writer)->set_chauffage_confort();
          } else if (x == "Chauffage Eco") {
            id(aldes_writer)->set_chauffage_eco();
          } else if (x == "Clim Confort") {
            id(aldes_writer)->set_clim_confort();
          } else if (x == "Clim Boost") {
            id(aldes_writer)->set_clim_boost();
          } else if (x == "Vacances") {
            id(aldes_writer)->set_vacances();
          }

# ═══════════════════════════════════════════════════════════════
# BINARY SENSORS - Bouches
# ═══════════════════════════════════════════════════════════════

binary_sensor:
  - platform: gpio
    name: "${bouche1a_name}"
    id: bouche_k1a
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO34
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "${bouche1b_name}"
    id: bouche_k1b
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO35
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "${bouche2_name}"
    id: bouche_k2
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO36
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "${bouche3_name}"
    id: bouche_k3
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO39
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "${bouche4_name}"
    id: bouche_k4
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO32
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "${bouche5_name}"
    id: bouche_k5
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO33
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

# ═══════════════════════════════════════════════════════════════
# SENSORS - Système et Mode PAC
# ═══════════════════════════════════════════════════════════════

sensor:
  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Mode PAC (lecture)"
    id: mode_pac_lecture
    register_type: holding
    address: 0x09
    value_type: U_WORD
    icon: "mdi:hvac"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Version Logiciel"
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:package
    register_type: holding
    address: 0x01
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Durée ON"
    entity_category: diagnostic
    icon: mdi:timer
    register_type: holding
    address: 0x03
    value_type: U_WORD
    unit_of_measurement: "min"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Panel ID (bas)"
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:identifier
    register_type: holding
    address: 0x0E
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Panel ID (haut)"
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:identifier
    register_type: holding
    address: 0x0F
    value_type: U_WORD

# NOTE: R16/R17 (Date/Heure Encodées) retirés - non fonctionnels sur RBUV via USB

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Protection Compresseur"
    entity_category: diagnostic
    icon: mdi:shield
    register_type: holding
    address: 0x33
    value_type: U_WORD

