    device_class: "temperature"
    register_type: holding
    address: 0x15
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Zone 3"
    device_class: "temperature"
    register_type: holding
    address: 0x16
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Zone 4"
    device_class: "temperature"
    register_type: holding
    address: 0x17
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Zone 5"
    device_class: "temperature"
    register_type: holding
    address: 0x18
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Zone 6"
    device_class: "temperature"
    register_type: holding
    address: 0x19
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  # --- TEMPÉRATURES PAC ---
  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Extérieure"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x70
    value_type: S_WORD
    unit_of_measurement: "°C"
