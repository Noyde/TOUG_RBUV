# ═══════════════════════════════════════════════════════════════
# TEXT SENSORS
# ═══════════════════════════════════════════════════════════════

text_sensor:
  - platform: version
    name: "Version ESPHome"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic

# ═══════════════════════════════════════════════════════════════
# BUTTON
# ═══════════════════════════════════════════════════════════════

button:
  - platform: restart
    name: "Redémarrer"
    entity_category: config
