# ═══════════════════════════════════════════════════════════════
# TOUG_RBUV - Configuration ESPHome pour PAC Aldes T.One RBUV
# Modèles 2018 et antérieurs
# ═══════════════════════════════════════════════════════════════
#
# Ce fichier utilise le composant custom aldes_tone pour l'écriture
# via le protocole propriétaire 0x17.
#
# Prérequis:
# - Télécommande Aldes DÉBRANCHÉE (collision sinon)
# - Connexion sur bus RS485 télécommande (19200 bauds)
#
# ═══════════════════════════════════════════════════════════════

esphome:
  name: aldes-tone
  friendly_name: "Aldes T.One AIR"
  min_version: 2025.11.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Aldes-Tone Fallback"
    password: "fallback123"

captive_portal:

# ═══════════════════════════════════════════════════════════════
# EXTERNAL COMPONENT - Aldes T.One Writer
# ═══════════════════════════════════════════════════════════════

external_components:
  - source:
      type: local
      path: aldes_tone_component/components

# ═══════════════════════════════════════════════════════════════
# UART pour Modbus RS485
# ═══════════════════════════════════════════════════════════════

uart:
  id: mod_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  parity: EVEN
  stop_bits: 1

# ═══════════════════════════════════════════════════════════════
# Modbus Controller (pour lecture standard)
# ═══════════════════════════════════════════════════════════════

modbus:
  id: modbus1
  uart_id: mod_uart
  flow_control_pin: GPIO4

modbus_controller:
  - id: aldes
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 30s

# ═══════════════════════════════════════════════════════════════
# ALDES TONE WRITER (Protocole 0x17 pour écriture modes)
# ═══════════════════════════════════════════════════════════════

aldes_tone:
  id: aldes_writer
  uart_id: mod_uart

# ═══════════════════════════════════════════════════════════════
# SELECT - Mode PAC (écriture via protocole custom 0x17)
# ═══════════════════════════════════════════════════════════════

select:
  - platform: template
    name: "Mode PAC"
    id: mode_pac
    icon: "mdi:hvac"
    options:
      - "Off"
      - "Chauffage Confort"
      - "Chauffage Eco"
      - "Clim Confort"
      - "Clim Boost"
      - "Vacances"
    initial_option: "Chauffage Confort"
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Off") {
            id(aldes_writer)->set_off();
          } else if (x == "Chauffage Confort") {
            id(aldes_writer)->set_chauffage_confort();
          } else if (x == "Chauffage Eco") {
            id(aldes_writer)->set_chauffage_eco();
          } else if (x == "Clim Confort") {
            id(aldes_writer)->set_clim_confort();
          } else if (x == "Clim Boost") {
            id(aldes_writer)->set_clim_boost();
          } else if (x == "Vacances") {
            id(aldes_writer)->set_vacances();
          }

# ═══════════════════════════════════════════════════════════════
# BINARY SENSORS - Bouches
# ═══════════════════════════════════════════════════════════════

binary_sensor:
  - platform: gpio
    name: "Bouche Salon"
    id: bouche_k1a
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO34
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "Bouche Cuisine"
    id: bouche_k1b
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO35
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "Bouche Chambre Parentale"
    id: bouche_k2
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO36
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "Bouche Bureau"
    id: bouche_k3
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO39
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "Bouche Chambre Angèle"
    id: bouche_k4
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO32
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

  - platform: gpio
    name: "Bouche Chambre Marcus"
    id: bouche_k5
    device_class: opening
    icon: "mdi:hvac"
    pin:
      number: GPIO33
      mode: INPUT
    filters:
      - delayed_on: 100ms
      - delayed_off: 50000ms

# ═══════════════════════════════════════════════════════════════
# SENSORS - Système et Mode PAC
# ═══════════════════════════════════════════════════════════════

sensor:
  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Mode PAC (lecture)"
    id: mode_pac_lecture
    register_type: holding
    address: 0x09
    value_type: U_WORD
    icon: "mdi:hvac"

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Version Logiciel"
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:package
    register_type: holding
    address: 0x01
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Durée ON"
    entity_category: diagnostic
    icon: mdi:timer
    register_type: holding
    address: 0x03
    value_type: U_WORD
    unit_of_measurement: "min"

# ═══════════════════════════════════════════════════════════════
# SENSORS - Consignes (LECTURE SEULE - pilotées par thermostats radio)
# MAPPING v3.0 : R20=Salon-Cuisine, R22=Parentale, R23=Bureau, R24=Angèle, R25=Marcus
# ═══════════════════════════════════════════════════════════════

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Salon-Cuisine"
    icon: "mdi:thermostat"
    register_type: holding
    address: 0x14
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Chambre Parentale"
    icon: "mdi:thermostat"
    register_type: holding
    address: 0x16
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Bureau"
    icon: "mdi:thermostat"
    register_type: holding
    address: 0x17
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Chambre Angèle"
    icon: "mdi:thermostat"
    register_type: holding
    address: 0x18
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Consigne Chambre Marcus"
    icon: "mdi:thermostat"
    register_type: holding
    address: 0x19
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

