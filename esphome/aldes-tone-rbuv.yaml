  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Chambre Parentale"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x26
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Bureau"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
    address: 0x27
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: aldes
    name: "Température Chambre Angèle"
    device_class: "temperature"
    state_class: "measurement"
    register_type: holding
