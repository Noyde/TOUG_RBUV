# Secrets ESPHome pour PAC Aldes T.One RBUV
# Copier ce fichier en secrets.yaml et configurer vos valeurs
#
# cp secrets_example.yaml secrets.yaml
# nano secrets.yaml

# WiFi
wifi_ssid: "VotreSSID"
wifi_password: "VotreMotDePasse"

# API ESPHome (optionnel, laisser vide pour désactiver)
api_encryption_key: ""

# OTA (optionnel)
ota_password: ""

# Noms des zones (personnalisables)
# R20/R21 = même thermostat (Zone 1), R22-R25 = Zones 2-5
zone1_name: "Zone 1"
zone1bis_name: "Zone 1 bis"
zone2_name: "Zone 2"
zone3_name: "Zone 3"
zone4_name: "Zone 4"
zone5_name: "Zone 5"

# Noms des bouches (personnalisables)
bouche1a_name: "Bouche Zone 1a"
bouche1b_name: "Bouche Zone 1b"
bouche2_name: "Bouche Zone 2"
bouche3_name: "Bouche Zone 3"
bouche4_name: "Bouche Zone 4"
bouche5_name: "Bouche Zone 5"
